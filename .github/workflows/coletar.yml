name: Coletar boletins de urna

on:
  schedule:
    # A cada 15 min no dia do 2º turno e no dia seguinte (UTC).
    - cron: "*/15 * * * *"
  workflow_dispatch:        # permite rodar na mão
  push:
    branches: [main]
    paths: ["config.json", "coletor/**", "docs/index.html"]

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Guarda os BUs já baixados entre execuções: BU não muda depois de gerado.
      - name: Restaurar cache de boletins
        uses: actions/cache@v4
        with:
          path: .cache
          key: bu-cache-${{ github.run_id }}
          restore-keys: bu-cache-

      - name: Coletar
        run: python3 coletor/coleta.py
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: coletor

      - name: Publicar dados
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dados
          if git diff --staged --quiet; then
            echo "nada mudou"
          else
            git commit -m "dados: atualiza apuração ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
