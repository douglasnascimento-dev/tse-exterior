<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brasil — apuração minuto a minuto</title>
<link rel="stylesheet" href="estilo.css">
<style>
  .mini { height:7px; border-radius:99px; background:var(--grid);
          overflow:hidden; min-width:70px; }
  .mini i { display:block; height:100%; background:var(--text-muted); }
  .links { display:flex; gap:10px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Apuração no Brasil · 2º turno de 2026</h1>
    <div class="toolbar links">
      <a href="./"><button>↪ votação no exterior</button></a>
      <button id="tema" title="Alternar tema">◐</button>
    </div>
  </header>

  <div class="hero">
    <p class="nome" id="nome">carregando…</p>
    <p class="ctx" id="sub"></p>
    <div class="barra"><i id="prog" style="width:0"></i></div>
  </div>

  <div id="conteudo"></div>

  <footer>
    Fonte: totalização agregada de
    <a href="https://resultados.tse.jus.br" rel="noreferrer">resultados.tse.jus.br</a>.
    O Brasil tem ~499 mil seções, então aqui não se lê boletim por boletim como
    no exterior — vem o agregado oficial, relido a cada minuto.
    <span id="ger"></span>
  </footer>
</div>
<div class="tip" id="tip" role="tooltip"></div>

<script>
const $ = s => document.querySelector(s);
const tip = $("#tip");
const nf = n => (n ?? 0).toLocaleString("pt-BR");
const sf = n => (n > 0 ? "+" : "") + nf(n);
const dec = (v, c = 1) => v == null ? "—" : v.toFixed(c).replace(".", ",");
const pp = n => (n > 0 ? "+" : "") + dec(n, 2) + " p.p.";

$("#tema").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const dark = cur ? cur === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  if (DADOS) desenha();
};

function mostraTip(e, html) {
  tip.innerHTML = html; tip.style.opacity = 1;
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY - r.height / 2;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  tip.style.left = Math.max(8, x) + "px";
  tip.style.top = Math.min(innerHeight - r.height - 8, Math.max(8, y)) + "px";
}
const escondeTip = () => tip.style.opacity = 0;

let DADOS = null, HIST = [], B22 = null, C22 = null, C1T = null;

function share(bloco, n) {
  return bloco && bloco.validos ? 100 * (bloco.votos[n] || 0) / bloco.validos : null;
}

/* ---- evolução minuto a minuto ---- */
function evolucao(d, cores) {
  const nums = Object.keys(d.candidatos).sort((a, b) => a - b);
  const pts = HIST.filter(h => nums.every(n => h[`p${n}`] != null));
  if (pts.length < 2) {
    return `<div class="card"><h2>Minuto a minuto</h2>
      <p class="note">${pts.length ? "Uma leitura até agora" : "Nada apurado ainda"}.
      A curva aparece a partir da segunda leitura — o robô lê o feed do TSE a
      cada minuto enquanto a apuração corre.</p></div>`;
  }
  const W = 760, H = 320, m = { t: 16, r: 92, b: 36, l: 46 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const ts = pts.map(h => new Date(h.gerado_em).getTime());
  const t0 = Math.min(...ts), tN = Math.max(...ts);
  const vals = pts.flatMap(h => nums.map(n => h[`p${n}`]));
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const folga = Math.max(1.5, (hi - lo) * 0.2);
  lo = Math.max(0, lo - folga); hi = Math.min(100, hi + folga);
  const X = t => m.l + (tN === t0 ? iw : (t - t0) / (tN - t0) * iw);
  const Y = v => m.t + (hi - v) / (hi - lo) * ih;

  let eixo = "";
  for (let i = 0; i <= 4; i++) {
    const v = lo + (hi - lo) * i / 4, y = Y(v);
    eixo += `<line class="gl" x1="${m.l}" x2="${m.l + iw}" y1="${y}" y2="${y}"></line>
      <text class="ax" x="${m.l - 8}" y="${y + 4}" text-anchor="end">${dec(v)}%</text>`;
  }
  const hora = t => new Date(t).toLocaleTimeString("pt-BR",
    { hour: "2-digit", minute: "2-digit" });
  eixo += `<text class="ax" x="${m.l}" y="${m.t + ih + 21}">${hora(t0)}</text>
    <text class="ax" x="${m.l + iw}" y="${m.t + ih + 21}" text-anchor="end">${hora(tN)}</text>`;

  let linhas = "";
  nums.forEach((n, i) => {
    const dd = pts.map((h, k) => `${X(ts[k]).toFixed(1)} ${Y(h[`p${n}`]).toFixed(1)}`);
    const ult = pts[pts.length - 1];
    linhas += `<path d="M${dd.join("L")}" fill="none" stroke="${cores[i]}"
        stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>
      <circle cx="${X(tN)}" cy="${Y(ult[`p${n}`])}" r="4" fill="${cores[i]}"
        stroke="var(--surface-1)" stroke-width="2"></circle>
      <text class="lbl-strong" x="${m.l + iw + 10}" y="${Y(ult[`p${n}`]) + 4}"
        fill="${cores[i]}">${dec(ult[`p${n}`])}%</text>`;
  });

  const faixa = iw / Math.max(1, pts.length - 1);
  const alvos = pts.map((h, k) => `<rect x="${(X(ts[k]) - faixa / 2).toFixed(1)}"
      y="${m.t}" width="${Math.max(faixa, 3).toFixed(1)}" height="${ih}"
      fill="transparent" data-tip="${encodeURIComponent(
        `<b>${hora(ts[k])}</b> · ${dec(h.pct, 2)}% apurado<br>`
        + nums.map(n => `${d.candidatos[n]}: <b>${dec(h[`p${n}`])}%</b>`).join("<br>")
        + `<br><span style="opacity:.7">${nf(h.validos)} votos válidos</span>`)}"></rect>`
  ).join("");

  const leg = nums.map((n, i) =>
    `<span><span class="sw" style="background:${cores[i]}"></span>${d.candidatos[n]}</span>`
  ).join("");

  return `<div class="card"><h2>Minuto a minuto</h2>
    <p class="note">Porcentagem sobre votos válidos a cada leitura.
      ${pts.length} leituras, de ${hora(t0)} a ${hora(tN)}.</p>
    <div class="legend">${leg}</div>
    <div class="scroll"><svg viewBox="0 0 ${W} ${H}" role="img">
      ${eixo}${linhas}${alvos}</svg></div></div>`;
}

function curvasPassadas(d, cores) {
  return curvaComparada(d, cores, C22 && C22["2T"] && C22["2T"].pontos, {
      titulo: "A curva do 2º turno de 2022",
      descricao: "Para comparar com a de hoje assim que a apuração começar.",
      rotulo: "2022", adversario: "Jair Bolsonaro (2022)", chave: "p" })
    + nivel1T(d, cores);
}

function desenha() {
  const d = DADOS, nums = Object.keys(d.candidatos).sort((a, b) => a - b);
  const css = getComputedStyle(document.documentElement);
  const cores = [css.getPropertyValue("--series-1").trim(),
                 css.getPropertyValue("--series-2").trim()];
  const b2 = d.turno2.br, b1 = d.turno1.br;

  $("#ger").textContent = " · lido em "
    + new Date(d.gerado_em).toLocaleString("pt-BR");

  if (!b2) {
    $("#nome").textContent = "sem dados";
    $("#sub").textContent = "o feed do TSE ainda não respondeu";
    return;
  }
  $("#nome").textContent = dec(b2.pct_secoes, 2) + "% apurado";
  $("#sub").innerHTML = `<strong>${nf(b2.secoes_totalizadas)}</strong> de `
    + `${nf(b2.secoes_totais)} seções totalizadas`
    + (b2.atualizado ? ` · TSE atualizou às ${b2.atualizado.split(" ")[1] || ""}` : "");
  $("#prog").style.width = Math.max(0.4, b2.pct_secoes) + "%";

  if (!b2.validos) {
    $("#conteudo").innerHTML = `<div class="card"><div class="empty">
      A apuração ainda não começou. As urnas no Brasil fecham às 17h de Brasília
      e esta página se atualiza sozinha a partir daí.</div></div>`
      + curvasPassadas(d, cores) + comparaTurno1(d, cores, true)
      + compara2022(d, cores);
    return;
  }

  const p2 = nums.map(n => share(b2, n));
  const resto = Math.max(0, 100 - p2[0] - p2[1]);
  const lado = (i, dir) => `<div class="lado ${dir}">
      <div class="nm"><span class="sw" style="background:${cores[i]}"></span>${d.candidatos[nums[i]]}</div>
      <div class="pc" style="color:${cores[i]}">${dec(p2[i])}%</div>
      <div class="qn">${nf(b2.votos[nums[i]])} votos</div></div>`;

  const confronto = `<div class="card"><h2>Como está agora</h2>
    <p class="note">Sobre votos válidos, com ${dec(b2.pct_secoes, 2)}% das seções
      totalizadas.</p>
    <div class="confronto">${lado(0, "esq")}${lado(1, "dir")}</div>
    <div class="pilha">
      <i style="width:${p2[0]}%;background:${cores[0]}"></i>
      <i style="width:${p2[1]}%;background:${cores[1]}"></i>
      ${resto > 0.05 ? `<i style="width:${resto}%;background:var(--neutral)"></i>` : ""}
    </div>
    <p class="antes">${nf(b2.validos)} votos válidos ·
      ${nf(b2.brancos)} brancos · ${nf(b2.nulos)} nulos ·
      ${nf(b2.total)} de comparecimento</p></div>`;

  const tiles = `<div class="tiles">
    <div class="tile"><div class="k">Vantagem de ${
      d.candidatos[nums[p2[0] >= p2[1] ? 0 : 1]]}</div>
      <div class="v" style="color:${cores[p2[0] >= p2[1] ? 0 : 1]}">${
        nf(Math.abs(b2.votos[nums[0]] - b2.votos[nums[1]]))}</div>
      <div class="n">${dec(Math.abs(p2[0] - p2[1]), 2)} pontos percentuais</div></div>
    <div class="tile"><div class="k">Votos válidos</div>
      <div class="v">${nf(b2.validos)}</div>
      <div class="n">exclui brancos e nulos</div></div>
    <div class="tile"><div class="k">Seções totalizadas</div>
      <div class="v">${dec(b2.pct_secoes, 2)}%</div>
      <div class="n">${nf(b2.secoes_totalizadas)} de ${nf(b2.secoes_totais)}</div></div>
  </div>`;

  const curvas =
    curvaComparada(d, cores, C22 && C22["2T"] && C22["2T"].pontos, {
      titulo: "Contra a curva do 2º turno de 2022",
      descricao: `Como a porcentagem andou conforme as seções entraram, no mesmo
        eixo de apuração. Em 2022 o adversário era Jair Bolsonaro.`,
      rotulo: "2022", adversario: "Jair Bolsonaro (2022)", chave: "p",
      nota: "Sobre votos válidos, nos dois casos.",
    })
    + nivel1T(d, cores);

  $("#conteudo").innerHTML = tiles + confronto + evolucao(d, cores) + curvas
    + comparaTurno1(d, cores) + compara2022(d, cores) + tabelaUF(d, cores);
  ligaTips();
}

/* ---- 2º turno de 2022 contra o de agora, no Brasil ---- */
/* ---- curva de hoje contra a de uma eleição passada, no eixo do apurado ---- */
/* ---- 1º turno de 2026: nível final, porque a curva não existe ---- */
function nivel1T(d, cores) {
  const nums = Object.keys(d.candidatos).sort((a, b) => a - b);
  const [a, b] = nums;
  // se o TSE já tiver publicado o histórico de 2026, usa a curva de verdade
  if (C1T && C1T.pontos && C1T.pontos.length > 2) {
    return curvaComparada(d, cores, C1T.pontos, {
      titulo: "Contra a curva do 1º turno de 2026",
      descricao: `A mesma eleição, três semanas antes. Como o 1º turno tinha 14
        candidatos, a porcentagem é só entre os dois que foram ao 2º turno.`,
      rotulo: "1º turno", adversario: "Flávio Bolsonaro (1º turno)", chave: "d",
    });
  }
  const b1 = d.turno1.br;
  if (!b1 || !b1.validos) return "";
  // só entre os dois finalistas: o 1º turno tinha 14 candidatos
  const dois = (b1.votos[a] || 0) + (b1.votos[b] || 0);
  if (!dois) return "";
  const n1 = [100 * b1.votos[a] / dois, 100 * b1.votos[b] / dois];
  // uma "curva" plana de dois pontos desenha o nível ao longo do eixo
  const plano = [{ pct: 0, d13: n1[0], d22: n1[1] },
                 { pct: 100, d13: n1[0], d22: n1[1] }];
  return curvaComparada(d, cores, plano, {
    titulo: "Contra o 1º turno de 2026",
    descricao: `A mesma eleição, três semanas antes — mas como <strong>nível</strong>,
      não como curva: o TSE só publica o histórico minuto a minuto semanas
      depois, e o de 2026 ainda não saiu. Como o 1º turno tinha 14 candidatos,
      a porcentagem aqui é só entre os dois que foram ao 2º turno.`,
    rotulo: "1º turno", adversario: "Flávio Bolsonaro (1º turno)", chave: "d",
    nota: "A linha tracejada é o resultado fechado do 1º turno, constante ao "
          + "longo do eixo — não o caminho que ele percorreu.",
  });
}

function curvaComparada(d, cores, passada, cfg) {
  const nums = Object.keys(d.candidatos).sort((a, b) => a - b);
  const [a, b] = nums;
  const vivo = HIST.filter(h => h.p13 != null && h.pct > 0)
    .map(h => ({ x: h.pct, ya: h[`p${a}`], yb: h[`p${b}`] }));
  const ref = (passada || []).map(p => ({
    x: p.pct, ya: p[cfg.chave + "13"], yb: p[cfg.chave + "22"] }))
    .filter(p => p.ya != null && p.x > 0);
  if (!ref.length) return "";

  const W = 760, H = 330, m = { t: 18, r: 92, b: 40, l: 48 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const todos = [...ref, ...vivo];
  let lo = Math.min(...todos.flatMap(p => [p.ya, p.yb]));
  let hi = Math.max(...todos.flatMap(p => [p.ya, p.yb]));
  const folga = Math.max(1.5, (hi - lo) * 0.12);
  lo = Math.max(0, lo - folga); hi = Math.min(100, hi + folga);
  const X = v => m.l + (v / 100) * iw;
  const Y = v => m.t + (hi - v) / (hi - lo) * ih;

  let eixo = "";
  for (let i = 0; i <= 4; i++) {
    const v = lo + (hi - lo) * i / 4, y = Y(v);
    eixo += `<line class="gl" x1="${m.l}" x2="${m.l + iw}" y1="${y}" y2="${y}"></line>
      <text class="ax" x="${m.l - 8}" y="${y + 4}" text-anchor="end">${dec(v)}%</text>`;
  }
  [0, 25, 50, 75, 100].forEach(v => {
    eixo += `<text class="ax" x="${X(v)}" y="${m.t + ih + 20}"
      text-anchor="middle">${v}%</text>`;
  });
  eixo += `<text class="ax" x="${m.l + iw / 2}" y="${m.t + ih + 36}"
    text-anchor="middle">seções totalizadas</text>`;

  const traco = (pts, chave, cor, tracejado) => pts.length < 2 ? "" :
    `<path d="M${pts.map(p => `${X(p.x).toFixed(1)} ${Y(p[chave]).toFixed(1)}`)
      .join("L")}" fill="none" stroke="${cor}" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"
      ${tracejado ? 'stroke-dasharray="5 4" opacity=".65"' : ""}></path>`;

  let linhas = traco(ref, "ya", cores[0], true) + traco(ref, "yb", cores[1], true)
    + traco(vivo, "ya", cores[0], false) + traco(vivo, "yb", cores[1], false);

  const fim = ref[ref.length - 1];
  linhas += `<text class="lbl" x="${m.l + iw + 8}" y="${Y(fim.ya) + 4}"
      fill="${cores[0]}" opacity=".8">${dec(fim.ya)}%</text>
    <text class="lbl" x="${m.l + iw + 8}" y="${Y(fim.yb) + 4}"
      fill="${cores[1]}" opacity=".8">${dec(fim.yb)}%</text>`;
  if (vivo.length) {
    const u = vivo[vivo.length - 1];
    linhas += `<circle cx="${X(u.x)}" cy="${Y(u.ya)}" r="4" fill="${cores[0]}"
        stroke="var(--surface-1)" stroke-width="2"></circle>
      <circle cx="${X(u.x)}" cy="${Y(u.yb)}" r="4" fill="${cores[1]}"
        stroke="var(--surface-1)" stroke-width="2"></circle>
      <line x1="${X(u.x)}" x2="${X(u.x)}" y1="${m.t}" y2="${m.t + ih}"
        stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="2 3"
        opacity=".6"></line>`;
  }

  // comparação no mesmo ponto de apuração
  let diag = `<p class="antes">A apuração de hoje ainda não começou — a curva
    de ${cfg.rotulo} está aí para comparar assim que os primeiros votos saírem.</p>`;
  if (vivo.length) {
    const u = vivo[vivo.length - 1];
    let maisProx = ref[0];
    ref.forEach(p => {
      if (Math.abs(p.x - u.x) < Math.abs(maisProx.x - u.x)) maisProx = p;
    });
    const dif = u.ya - maisProx.ya;
    diag = `<p class="antes">Com <strong>${dec(u.x, 1)}%</strong> apurado,
      ${d.candidatos[a]} tem <strong>${dec(u.ya)}%</strong>. No mesmo ponto de
      ${cfg.rotulo} ele tinha ${dec(maisProx.ya)}% —
      <strong>${(dif > 0 ? "+" : "") + dec(dif, 2)} p.p.</strong>.
      ${cfg.nota || ""}</p>`;
  }

  const leg = `<div class="legend">
    <span><span class="sw" style="background:${cores[0]}"></span>${d.candidatos[a]}</span>
    <span><span class="sw" style="background:${cores[1]}"></span>${cfg.adversario}</span>
    <span style="color:var(--text-muted)">— contínuo: hoje · ··· tracejado: ${cfg.rotulo}</span>
  </div>`;

  return `<div class="card"><h2>${cfg.titulo}</h2>
    <p class="note">${cfg.descricao}</p>
    ${leg}
    <div class="scroll"><svg viewBox="0 0 ${W} ${H}" role="img">
      ${eixo}${linhas}</svg></div>
    ${diag}</div>`;
}

function compara2022(d, cores) {
  if (!B22 || !B22.br) return "";
  const nums = Object.keys(d.candidatos).sort((a, b) => a - b);
  const [a, b] = nums;
  const v22 = B22.br;
  const p22 = [100 * v22[a] / v22.validos, 100 * v22[b] / v22.validos];
  const b2 = d.turno2.br;
  const tem = b2 && b2.validos;
  const p26 = tem ? nums.map(n => share(b2, n)) : null;

  const faixa = (rot, nota, p) => `<div class="ano">
      <div class="rot">${rot}<span class="peq">${nota}</span></div>
      <div class="pilha">
        <i style="width:${p[0]}%;background:${cores[0]}"></i>
        <i style="width:${p[1]}%;background:${cores[1]}"></i>
      </div>
      <div class="vals">
        <span style="color:${cores[0]}"><b>${dec(p[0])}%</b></span>
        <span style="color:${cores[1]}" class="dirx"><b>${dec(p[1])}%</b></span>
      </div></div>`;

  return `<div class="card"><h2>Contra o 2º turno de 2022</h2>
    <p class="note">Sobre votos válidos, Brasil inteiro. Em 2022 o adversário
      era Jair Bolsonaro; agora é Flávio Bolsonaro — a comparação indica
      tendência, não equivalência.</p>
    ${faixa("2022", ` · resultado final · ${nf(v22.validos)} votos válidos`, p22)}
    ${tem ? faixa("2026", ` · parcial, ${dec(b2.pct_secoes, 2)}% apurado`, p26) : ""}
    ${tem ? `<p class="antes" style="margin-top:12px">
      ${nums.map((n, i) => `<strong>${d.candidatos[n]}</strong> ${pp(p26[i] - p22[i])}`)
        .join(" · ")} em relação a 2022.</p>` : ""}
  </div>`;
}

function comparaTurno1(d, cores, soTexto) {
  const nums = Object.keys(d.candidatos).sort((a, b) => a - b);
  const b1 = d.turno1.br, b2 = d.turno2.br;
  if (!b1 || !b1.validos) return "";
  const p1 = nums.map(n => share(b1, n));
  const temT2 = b2 && b2.validos;
  const p2 = temT2 ? nums.map(n => share(b2, n)) : null;

  const faixa = (rot, nota, p) => `<div class="ano">
      <div class="rot">${rot}<span class="peq">${nota}</span></div>
      <div class="pilha">
        <i style="width:${p[0]}%;background:${cores[0]}"></i>
        <i style="width:${p[1]}%;background:${cores[1]}"></i>
        <i style="width:${Math.max(0, 100 - p[0] - p[1])}%;background:var(--neutral)"></i>
      </div>
      <div class="vals">
        <span style="color:${cores[0]}"><b>${dec(p[0])}%</b></span>
        <span style="color:${cores[1]}" class="dirx"><b>${dec(p[1])}%</b></span>
      </div></div>`;

  return `<div class="card"><h2>Contra o 1º turno</h2>
    <p class="note">Sobre votos válidos, Brasil inteiro. No 1º turno havia 14
      candidatos, por isso os dois não somam 100% ali.</p>
    ${faixa("1º turno", " · 4 de outubro, resultado final", p1)}
    ${temT2 ? faixa("2º turno", ` · parcial, ${dec(b2.pct_secoes, 2)}% apurado`, p2) : ""}
    ${temT2 ? `<p class="antes" style="margin-top:12px">
      ${nums.map((n, i) => `<strong>${d.candidatos[n]}</strong> ${pp(p2[i] - p1[i])}`)
        .join(" · ")} em relação ao 1º turno.</p>` : ""}
  </div>`;
}

function tabelaUF(d, cores) {
  const nums = Object.keys(d.candidatos).sort((a, b) => a - b);
  const idx1 = Object.fromEntries((d.turno1.ufs || []).map(u => [u.uf, u]));
  const ufs = (d.turno2.ufs || []).filter(u => u.validos)
    .sort((a, b) => b.validos - a.validos);
  if (!ufs.length) return "";
  const linhas = ufs.map(u => {
    const p = nums.map(n => share(u, n));
    const u1 = idx1[u.uf];
    const p1 = u1 && u1.validos ? nums.map(n => share(u1, n)) : null;
    const lider = p[0] >= p[1] ? 0 : 1;
    const u22 = B22 && B22.ufs ? B22.ufs[u.uf] : null;
    const sw = u22 && u22.validos
      ? p[0] - 100 * u22[nums[0]] / u22.validos : null;
    return `<tr>
      <td>${u.uf === "zz" ? "Exterior" : u.uf.toUpperCase()}</td>
      <td><div class="mini"><i style="width:${u.pct_secoes}%"></i></div>
        <span class="peq">${dec(u.pct_secoes, 1)}%</span></td>
      <td>${dec(p[0])}%<span class="peq">${p1 ? dec(p1[0]) + "% no 1T" : ""}</span></td>
      <td>${dec(p[1])}%<span class="peq">${p1 ? dec(p1[1]) + "% no 1T" : ""}</span></td>
      <td style="color:${cores[lider]};font-weight:600">${d.candidatos[nums[lider]].split(" ")[0]}</td>
      <td>${sw == null ? "—" : pp(sw)}</td>
      <td>${nf(u.validos)}</td></tr>`;
  }).join("");
  return `<div class="card"><h2>Por estado</h2>
    <p class="note">${ufs.length} unidades com apuração iniciada, da maior para a
      menor em votos válidos.</p>
    <div class="scroll"><table><thead><tr>
      <th>UF</th><th>Apurado</th>
      <th><span class="sw" style="background:${cores[0]}"></span>${d.candidatos[nums[0]]}</th>
      <th><span class="sw" style="background:${cores[1]}"></span>${d.candidatos[nums[1]]}</th>
      <th>Lidera</th><th title="Variação de ${d.candidatos[nums[0]]} ante 2022">vs 2022</th><th>Válidos</th>
    </tr></thead><tbody>${linhas}</tbody></table></div></div>`;
}

function ligaTips() {
  document.querySelectorAll("[data-tip]").forEach(el => {
    el.addEventListener("mousemove", e =>
      mostraTip(e, decodeURIComponent(el.dataset.tip)));
    el.addEventListener("mouseleave", escondeTip);
  });
}

function carrega() {
  return Promise.all([
    fetch("dados/brasil.json", { cache: "no-store" })
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .catch(e => { e.semDados = true; throw e; }),
    fetch("dados/brasil_historico.jsonl", { cache: "no-store" })
      .then(r => r.ok ? r.text() : "").catch(() => ""),
    fetch("dados/brasil_2022.json").then(r => r.ok ? r.json() : null)
      .catch(() => null),
    fetch("dados/curvas_2022.json").then(r => r.ok ? r.json() : null)
      .catch(() => null),
    fetch("dados/curva_1t_2026.json").then(r => r.ok ? r.json() : null)
      .catch(() => null),
  ]).then(([d, hist, b22, c22, c1t]) => {
    DADOS = d; B22 = b22; C22 = c22; C1T = c1t;
    HIST = hist.split("\n").filter(l => l.trim())
      .map(l => { try { return JSON.parse(l); } catch { return null; } })
      .filter(Boolean)
      .sort((a, b) => a.gerado_em.localeCompare(b.gerado_em));
    desenha();
  }).catch(e => {
    const semDados = e.semDados === true;
    $("#nome").textContent = semDados ? "sem dados" : "erro ao desenhar";
    $("#conteudo").innerHTML = `<div class="card"><div class="empty">` + (semDados
      ? `Rode <code>python3 coletor/brasil.py</code> para gerar
         <code>docs/dados/brasil.json</code>. (${e.message})`
      : `<strong>${e.message}</strong><pre style="white-space:pre-wrap;
         font-size:11.5px">${(e.stack || "").slice(0, 800)}</pre>`) + `</div></div>`;
  });
}

carrega();
// enquanto a apuração corre, recarrega sozinho
setInterval(carrega, 60000);
</script>
