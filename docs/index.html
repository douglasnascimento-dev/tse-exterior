<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exterior — 1º × 2º turno</title>
<style>
  :root {
    color-scheme: light;
    --surface-0:#f6f6f4; --surface-1:#fcfcfb; --border:#e2e1dc;
    --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#7a7873;
    --series-1:#e34948; --series-2:#2a78d6; --neutral:#9b9892;
    --mapa-terra:#eceae4; --mapa-borda:#dbd9d2;
    --grid:#e8e7e2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-0:#111110; --surface-1:#1a1a19; --border:#33322e;
      --text-primary:#f0efec; --text-secondary:#c3c2b7; --text-muted:#8e8c84;
      --series-1:#e66767; --series-2:#3987e5; --neutral:#6f6d67;
      --mapa-terra:#26251f; --mapa-borda:#3a3832;
      --grid:#2a2926;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0:#111110; --surface-1:#1a1a19; --border:#33322e;
    --text-primary:#f0efec; --text-secondary:#c3c2b7; --text-muted:#8e8c84;
    --series-1:#e66767; --series-2:#3987e5; --neutral:#6f6d67;
      --mapa-terra:#26251f; --mapa-borda:#3a3832;
    --grid:#2a2926;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--surface-0); color:var(--text-primary);
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:1060px; margin:0 auto; padding:28px 16px 64px; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-start;
           justify-content:space-between; margin-bottom:6px; }
  h1 { font-size:14px; margin:0; letter-spacing:.02em; font-weight:600;
       color:var(--text-secondary); text-transform:uppercase; }
  .hero { margin:16px 0 4px; }
  .hero .nome { font-size:34px; font-weight:650; letter-spacing:-.025em;
                line-height:1.1; margin:0; }
  .hero .ctx { color:var(--text-secondary); font-size:13.5px; margin:7px 0 0; }
  .barra { height:6px; border-radius:99px; background:var(--grid);
           margin-top:11px; overflow:hidden; max-width:420px; }
  .barra i { display:block; height:100%; background:var(--text-muted); }
  .sub { color:var(--text-secondary); font-size:13px; margin:2px 0 0; }
  .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .seg { display:inline-flex; border:1px solid var(--border); border-radius:7px;
         overflow:hidden; background:var(--surface-1); }
  .seg button { border:0; border-radius:0; background:transparent; padding:6px 12px; }
  .seg button[aria-pressed="true"] { background:var(--text-primary);
                                     color:var(--surface-1); font-weight:600; }
  select, button {
    font:inherit; font-size:13px; padding:6px 10px; border-radius:7px;
    border:1px solid var(--border); background:var(--surface-1);
    color:var(--text-primary); cursor:pointer;
  }
  .badge { display:inline-flex; align-items:center; gap:6px; font-size:12px;
    color:var(--text-secondary); border:1px solid var(--border);
    background:var(--surface-1); padding:5px 10px; border-radius:999px; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--series-1); }
  .tiles { display:grid; gap:12px; margin:22px 0 8px;
    grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); }
  .tile { background:var(--surface-1); border:1px solid var(--border);
    border-radius:11px; padding:14px 16px; }
  .tile .k { font-size:12px; color:var(--text-secondary); margin-bottom:6px; }
  .tile .v { font-size:27px; font-weight:600; letter-spacing:-.02em;
             font-variant-numeric:tabular-nums; }
  .tile .n { font-size:12px; color:var(--text-muted); margin-top:3px; }
  .card { background:var(--surface-1); border:1px solid var(--border);
    border-radius:11px; padding:18px 18px 10px; margin-top:14px; }
  .card h2 { font-size:14px; margin:0 0 2px; }
  .card p.note { font-size:12px; color:var(--text-secondary); margin:0 0 14px; }
  .legend { display:flex; gap:16px; flex-wrap:wrap; font-size:12.5px;
    color:var(--text-secondary); margin:0 0 10px; }
  .sw { width:10px; height:10px; border-radius:3px;
    display:inline-block; margin-right:6px; vertical-align:-1px; }
  .scroll { overflow-x:auto; overflow-y:hidden; margin:0 -4px; padding:0 4px; }
  svg { display:block; width:100%; height:auto; overflow:visible; min-width:560px; }
  .ax { fill:var(--text-muted); font-size:11px; }
  .lbl { fill:var(--text-secondary); font-size:11.5px;
         font-variant-numeric:tabular-nums; }
  .lbl-strong { fill:var(--text-primary); font-size:12px; font-weight:600;
                font-variant-numeric:tabular-nums; }
  .gl { stroke:var(--grid); stroke-width:1; }
  table { width:100%; border-collapse:collapse; font-size:13px;
          font-variant-numeric:tabular-nums; min-width:560px; }
  th, td { text-align:right; padding:7px 8px; border-bottom:1px solid var(--border); }
  th:first-child, td:first-child { text-align:left; }
  thead th { color:var(--text-secondary); font-weight:500; font-size:12px; }
  tbody td:first-child { font-size:14.5px; font-weight:600; letter-spacing:-.01em; }
  tbody td .peq { display:block; font-size:11.5px; font-weight:400;
                  color:var(--text-muted); letter-spacing:0; }
  tfoot td { font-weight:600; border-top:1px solid var(--border); border-bottom:0; }
  td.delta { color:var(--text-primary); font-weight:600; }
  .tip { position:fixed; pointer-events:none; z-index:9; opacity:0;
    transition:opacity .09s; background:var(--surface-1); color:var(--text-primary);
    border:1px solid var(--border); border-radius:8px; padding:7px 10px;
    font-size:12.5px; box-shadow:0 4px 14px rgba(0,0,0,.14); max-width:260px; }
  .tip b { font-variant-numeric:tabular-nums; }
  footer { margin-top:26px; font-size:12px; color:var(--text-muted); }
  footer a { color:var(--text-secondary); }
  .empty { padding:26px 0; color:var(--text-secondary); font-size:14px; }
  .confronto { display:flex; justify-content:space-between; align-items:flex-end;
    gap:16px; flex-wrap:wrap; margin:2px 0 14px; }
  .lado .pc { font-size:40px; font-weight:650; letter-spacing:-.03em; line-height:1;
              font-variant-numeric:tabular-nums; }
  .lado .qn { font-size:13px; color:var(--text-secondary); margin-top:5px; }
  .lado .nm { font-size:13px; font-weight:600; margin-bottom:5px; }
  .lado.dir { text-align:right; }
  .pilha { display:flex; gap:2px; height:16px; margin:4px 0 9px; }
  .pilha i { display:block; border-radius:3px; }
  .antes { font-size:12.5px; color:var(--text-secondary); }
  .dupla { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
           margin-top:4px; }
  .bloco { border:1px solid var(--border); border-radius:9px; padding:13px 15px; }
  .bloco .rot { font-size:12px; color:var(--text-secondary); margin-bottom:9px; }
  .bloco .par { display:flex; justify-content:space-between; gap:10px;
                font-size:14px; padding:3px 0; font-variant-numeric:tabular-nums; }
  .bloco .par b { font-weight:650; }
  .bloco .concl { margin-top:10px; padding-top:9px; border-top:1px solid var(--border);
                  font-size:13px; color:var(--text-secondary); }
  .aviso { border:1px solid var(--series-1); border-radius:9px; padding:10px 13px;
    font-size:13px; color:var(--text-primary); background:var(--surface-1);
    margin-top:14px; }
  .pais { fill:var(--mapa-terra); stroke:var(--mapa-borda); stroke-width:.5;
          vector-effect:non-scaling-stroke; }
  .cidade { stroke:var(--surface-1); stroke-width:2; cursor:pointer; }
  .cidade:hover { stroke:var(--text-primary); }
  .tamanhos { display:flex; gap:18px; align-items:flex-end; font-size:11.5px;
    color:var(--text-muted); margin:10px 0 0; }
  .tamanhos i { display:inline-block; border-radius:50%;
    background:var(--neutral); margin-right:5px; vertical-align:-2px; }
  @media (max-width:560px) { .tile .v { font-size:23px; } h1 { font-size:18px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Votação no exterior · 1º × 2º turno de 2026</h1>
    <div class="toolbar">
      <select id="cidade" aria-label="Recorte"></select>
      <button id="tema" title="Alternar tema">◐</button>
    </div>
  </header>

  <div class="hero">
    <p class="nome" id="nome">carregando…</p>
    <p class="ctx" id="sub"></p>
    <div class="barra"><i id="prog" style="width:0"></i></div>
  </div>

  <div id="status"></div>
  <div id="mapa"></div>
  <div id="conteudo"></div>

  <footer>
    Fonte: boletins de urna de <a href="https://resultados.tse.jus.br"
    rel="noreferrer">resultados.tse.jus.br</a>, lidos direto do arquivo de urna
    assinado. Atualizado por GitHub Actions.
    <span id="ger"></span>
  </footer>
</div>
<div class="tip" id="tip" role="tooltip"></div>

<script>
const $ = s => document.querySelector(s);
const tip = $("#tip");
const nf = n => (n ?? 0).toLocaleString("pt-BR");
const sf = n => (n > 0 ? "+" : "") + nf(n);
const dec = (v, c = 1) => v.toFixed(c).replace(".", ",");
const pf = p => p == null ? "—" : (p > 0 ? "+" : "") + dec(p, 2) + "%";

$("#tema").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const dark = cur ? cur === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  if (DADOS) desenha();
};

function mostraTip(e, html) {
  tip.innerHTML = html;
  tip.style.opacity = 1;
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY - r.height / 2;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  tip.style.left = Math.max(8, x) + "px";
  tip.style.top = Math.min(innerHeight - r.height - 8, Math.max(8, y)) + "px";
}
const escondeTip = () => tip.style.opacity = 0;

/* ---- gráfico de barras agrupadas: turno no eixo, cor = candidato ---- */
function barrasAgrupadas(dados, series) {
  const W = 760, H = 300, m = { t: 14, r: 16, b: 34, l: 48 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const max = Math.max(...dados.flatMap(d => series.map(s => d[s.chave]))) || 1;
  const esc = v => ih - (v / (max * 1.12)) * ih;

  const gw = iw / dados.length;
  const bw = Math.min(62, (gw - 26) / series.length);
  const ticks = 4;
  let g = "";
  for (let i = 0; i <= ticks; i++) {
    const v = max * 1.12 * i / ticks, y = esc(v);
    g += `<line class="gl" x1="0" x2="${iw}" y1="${y}" y2="${y}"></line>
          <text class="ax" x="-9" y="${y + 4}" text-anchor="end">${nf(Math.round(v))}</text>`;
  }
  let b = "";
  dados.forEach((d, gi) => {
    const cx = gi * gw + gw / 2;
    const base = cx - (series.length * bw + (series.length - 1) * 2) / 2;
    series.forEach((s, si) => {
      const v = d[s.chave], x = base + si * (bw + 2), y = esc(v);
      const h = Math.max(ih - y, 2);
      b += `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="4"
               fill="${s.cor}" data-tip="${encodeURIComponent(
                 `<b>${s.nome}</b><br>${d.rotulo}: <b>${nf(v)}</b> votos`)}"></rect>
            <text class="lbl-strong" x="${x + bw / 2}" y="${y - 7}"
               text-anchor="middle">${nf(v)}</text>`;
    });
    b += `<text class="ax" x="${cx}" y="${ih + 22}" text-anchor="middle">${d.rotulo}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img">
      <g transform="translate(${m.l},${m.t})">${g}
        <line class="gl" x1="0" x2="${iw}" y1="${ih}" y2="${ih}"></line>${b}</g>
    </svg>`;
}

/* ---- barras horizontais de crescimento (Δ votos) ---- */
function barrasCrescimento(itens) {
  const W = 760, rh = 42, m = { l: 150, r: 70 };
  const H = itens.length * rh + 10;
  const max = Math.max(...itens.map(i => Math.abs(i.valor))) || 1;
  const iw = W - m.l - m.r;
  let s = "";
  itens.forEach((it, i) => {
    const y = i * rh + 8, w = Math.max(Math.abs(it.valor) / max * iw, 2);
    s += `<text class="lbl" x="${m.l - 12}" y="${y + 17}" text-anchor="end">${it.nome}</text>
      <rect x="${m.l}" y="${y + 4}" width="${w}" height="18" rx="4" fill="${it.cor}"
        data-tip="${encodeURIComponent(
          `<b>${it.nome}</b><br>${sf(it.valor)} votos · ${pf(it.pct)}`)}"></rect>
      <text class="lbl-strong" x="${m.l + w + 9}" y="${y + 18}">${sf(it.valor)}</text>
      <text class="ax" x="${m.l + w + 9}" y="${y + 31}">${pf(it.pct)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${s}</svg>`;
}


/* ---- mapa-múndi: círculo por cidade, cor = quem lidera, área = votos ---- */
const LAT_MAX = 78, LAT_MIN = -58, MAPA_W = 960;
const MAPA_H = Math.round(MAPA_W * (LAT_MAX - LAT_MIN) / 360);
const projX = lon => (lon + 180) / 360 * MAPA_W;
const projY = lat => (LAT_MAX - lat) / (LAT_MAX - LAT_MIN) * MAPA_H;

function caminhoPais(geom) {
  const anel = pts => "M" + pts.map(p => `${projX(p[0]).toFixed(1)} ${projY(p[1]).toFixed(1)}`)
    .join("L") + "Z";
  const polis = geom.type === "Polygon" ? [geom.coordinates] : geom.coordinates;
  // descarta anéis que cruzam a emenda da projeção (vazariam a tela)
  return polis.flat().filter(r => {
    const xs = r.map(p => p[0]);
    return Math.max(...xs) - Math.min(...xs) < 180;
  }).map(anel).join("");
}

function desenhaMapa(d, cores) {
  if (!MUNDO) return "";
  const comDados = d.cidades.filter(c => c.lat != null && c.metricas);
  if (!comDados.length) return "";
  const nums = Object.keys(d.candidatos).sort((a, b) => a - b);
  const vmax = Math.max(...comDados.map(c => c.metricas.total_t2));
  const raio = v => Math.max(3.2, 23 * Math.sqrt(v / vmax));

  const paises = MUNDO.features
    .map(f => `<path class="pais" d="${caminhoPais(f.geometry)}"></path>`).join("");

  // Postos muito próximos (Nagóia/Hamamatsu/Tóquio) se sobrepõem a ponto de
  // esconder uns aos outros. Afasta o suficiente para todos ficarem clicáveis,
  // e marca a posição real com um ponto e uma linha fina.
  const pontos = comDados
    .sort((a, b) => b.metricas.total_t2 - a.metricas.total_t2)
    .map(c => ({ c, x0: projX(c.lon), y0: projY(c.lat),
                 x: projX(c.lon), y: projY(c.lat), r: raio(c.metricas.total_t2) }));
  for (let passo = 0; passo < 120; passo++) {
    let moveu = false;
    for (let i = 0; i < pontos.length; i++)
      for (let j = i + 1; j < pontos.length; j++) {
        const a = pontos[i], b = pontos[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const min = a.r + b.r + 1.5;
        let dist = Math.hypot(dx, dy);
        if (dist >= min) continue;
        if (dist < 0.01) { b.x += 0.1; dist = 0.1; }
        const empurra = (min - dist) / 2, ux = dx / dist, uy = dy / dist;
        a.x -= ux * empurra; a.y -= uy * empurra;
        b.x += ux * empurra; b.y += uy * empurra;
        moveu = true;
      }
    if (!moveu) break;
  }

  const bolhas = pontos
    .sort((a, b) => b.r - a.r)                       // menores desenhadas por cima
    .map(({ c, x, y, r, x0, y0 }) => {
      const m = c.metricas, a = nums[0], b = nums[1];
      const lider = m.candidatos[a].t2 >= m.candidatos[b].t2 ? 0 : 1;
      const nomeLider = d.candidatos[nums[lider]];
      const share = m.candidatos[nums[lider]].share_t2;
      const desloc = Math.hypot(x - x0, y - y0);
      const guia = desloc > 3
        ? `<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x.toFixed(1)}"
             y2="${y.toFixed(1)}" stroke="var(--text-muted)" stroke-width=".6"></line>
           <circle cx="${x0.toFixed(1)}" cy="${y0.toFixed(1)}" r="1.3"
             fill="var(--text-muted)"></circle>` : "";
      return guia + `<circle class="cidade" cx="${x.toFixed(1)}"
        cy="${y.toFixed(1)}" r="${r.toFixed(1)}"
        fill="${cores[lider]}" fill-opacity="0.82" data-cidade="${c.codigo}"
        data-tip="${encodeURIComponent(
          `<b>${c.nome}</b><br>${nf(m.total_t2)} votos · `
          + `${c.secoes_apuradas_t2}/${c.secoes_previstas} seções<br>`
          + `${nomeLider}: <b>${dec(share)}%</b><br>`
          + `margem ${sf(m.margem_t2)} (era ${sf(m.margem_t1)})`)}"></circle>`;
    }).join("");

  const legCor = nums.map((n, i) =>
    `<span><span class="sw" style="background:${cores[i]}"></span>lidera ${d.candidatos[n]}</span>`
  ).join("");
  const passos = [vmax, vmax / 4, vmax / 16].map(v =>
    `<span><i style="width:${(raio(v) * 2).toFixed(0)}px;height:${(raio(v) * 2).toFixed(0)}px"></i>${nf(Math.round(v))}</span>`
  ).join("");

  return `<div class="card">
    <h2>Onde a apuração já chegou</h2>
    <p class="note">Uma bolha por cidade com boletim no 2º turno — área
      proporcional aos votos, cor indica quem lidera ali. Clique
      para abrir a cidade. Bolhas que se sobreporiam são afastadas, com uma
      linha fina apontando o lugar exato.</p>
    <div class="legend">${legCor}</div>
    <div class="scroll"><svg viewBox="0 0 ${MAPA_W} ${MAPA_H}" role="img"
      aria-label="Mapa-múndi das cidades apuradas">${paises}${bolhas}</svg></div>
    <div class="tamanhos"><span>votos:</span>${passos}</div>
  </div>`;
}


function tabelaRanking(d, cores) {
  const nums = Object.keys(d.candidatos).sort((a, b) => a - b);
  const base = MODO === "pais" ? porPais(d) : d.cidades;
  const itens = base.filter(x => x.metricas)
    .sort((a, b) => b.metricas.total_t2 - a.metricas.total_t2);
  if (!itens.length) return "";

  const linhas = itens.map(x => {
    const m = x.metricas, [a, b] = nums;
    const lider = m.candidatos[a].t2 >= m.candidatos[b].t2 ? a : b;
    const sub = MODO === "pais"
      ? `${x.ncidades} cidade${x.ncidades > 1 ? "s" : ""}`
      : (x.pais || "");
    return `<tr data-cidade="${x.codigo}" style="cursor:pointer">
      <td>${x.nome}<span class="peq">${sub}</span></td>
      <td>${nf(x.secoes_apuradas_t2)}<span class="peq">de ${nf(x.secoes_previstas)}</span></td>
      <td>${nf(m.candidatos[a].t2)}<span class="peq">${dec(m.candidatos[a].share_t2)}%</span></td>
      <td>${nf(m.candidatos[b].t2)}<span class="peq">${dec(m.candidatos[b].share_t2)}%</span></td>
      <td><span style="color:${cores[nums.indexOf(lider)]};font-weight:600">
        ${sf(m.margem_t2)}</span><span class="peq">era ${sf(m.margem_t1)}</span></td>
      <td>${nf(m.total_t2)}<span class="peq">${sf(m.delta_total)} vs 1T</span></td></tr>`;
  }).join("");

  const titulo = MODO === "pais" ? "Países com apuração" : "Cidades com apuração";
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;
                gap:12px;flex-wrap:wrap;margin-bottom:4px">
      <h2 style="margin:0">${titulo}</h2>
      <div class="seg" role="group" aria-label="Agrupar por">
        <button data-modo="cidade" aria-pressed="${MODO !== "pais"}">Cidades</button>
        <button data-modo="pais" aria-pressed="${MODO === "pais"}">Países</button>
      </div>
    </div>
    <p class="note">${itens.length} ${MODO === "pais" ? "países" : "cidades"}
      com pelo menos uma seção apurada. Clique numa linha para abrir.</p>
    <div class="scroll"><table><thead><tr>
      <th>${MODO === "pais" ? "País" : "Cidade"}</th><th>Seções</th>
      <th><span class="sw" style="background:${cores[0]}"></span>${d.candidatos[nums[0]]}</th>
      <th><span class="sw" style="background:${cores[1]}"></span>${d.candidatos[nums[1]]}</th>
      <th>Margem</th><th>Total 2T</th>
    </tr></thead><tbody>${linhas}</tbody></table></div></div>`;
}


/* ---- agrega um conjunto de cidades (para país ou para o total) ---- */
function somaCidades(lista, nums) {
  const vazio = () => {
    const o = { brancos: 0, nulos: 0, outros: 0, comparecimento: 0, aptos: 0, total: 0 };
    nums.forEach(n => o[n] = 0);
    return o;
  };
  const t1 = vazio(), t2 = vazio();
  let ap = 0, prev = 0;
  lista.forEach(c => {
    Object.keys(t1).forEach(k => { t1[k] += c.t1[k] || 0; t2[k] += c.t2[k] || 0; });
    ap += c.secoes_apuradas_t2; prev += c.secoes_previstas;
  });
  return { t1, t2, secoes_apuradas_t2: ap, secoes_previstas: prev,
           metricas: t2.total ? calcMetricas(t1, t2, nums) : null, secoes: [] };
}


/* ---- porcentagem de um contra o outro, agora e no 1º turno ---- */

/* ---- crescimento em votos e em percentual, lado a lado ---- */
function blocosCrescimento(d, m, cores) {
  const nums = Object.keys(d.candidatos).sort((a, b) => a - b);
  const [a, b] = nums;
  const ca = m.candidatos[a], cb = m.candidatos[b];
  const pp = n => (n > 0 ? "+" : "") + dec(n, 2) + " p.p.";

  // em votos: quem ganhou mais votos em números absolutos
  const dVotos = ca.delta - cb.delta;
  const ganhouVotos = dVotos === 0 ? null : (dVotos > 0 ? a : b);
  // em percentual: quem cresceu mais rápido em relação ao que já tinha
  const dPct = (ca.pct ?? 0) - (cb.pct ?? 0);
  const cresceuMais = dPct === 0 ? null : (dPct > 0 ? a : b);

  const par = (n, txt) => `<div class="par"><span>
      <span class="sw" style="background:${cores[nums.indexOf(n)]}"></span>
      ${d.candidatos[n]}</span><b>${txt}</b></div>`;

  return `<div class="dupla">
    <div class="bloco">
      <div class="rot">Em votos</div>
      ${par(a, sf(ca.delta))}
      ${par(b, sf(cb.delta))}
      <div class="concl">${ganhouVotos === null ? "Empate."
        : `<strong>${d.candidatos[ganhouVotos]}</strong> ganhou
           <strong>${nf(Math.abs(dVotos))}</strong> votos a mais.`}</div>
    </div>
    <div class="bloco">
      <div class="rot">Em percentual, sobre o que já tinha</div>
      ${par(a, pf(ca.pct))}
      ${par(b, pf(cb.pct))}
      <div class="concl">${cresceuMais === null ? "Empate."
        : `<strong>${d.candidatos[cresceuMais]}</strong> cresceu mais rápido:
           <strong>${pp(Math.abs(dPct))}</strong> de diferença.`}</div>
    </div>
  </div>`;
}

function confronto(d, m, cores) {
  const nums = Object.keys(d.candidatos).sort((a, b) => a - b);
  const [a, b] = nums;
  const pa = m.candidatos[a].share_t2, pb = m.candidatos[b].share_t2;
  const resto = Math.max(0, 100 - pa - pb);
  const lado = (n, p, v, dir) => `<div class="lado ${dir}">
      <div class="nm"><span class="sw" style="background:${cores[nums.indexOf(n)]}"></span>${d.candidatos[n]}</div>
      <div class="pc" style="color:${cores[nums.indexOf(n)]}">${dec(p)}%</div>
      <div class="qn">${nf(v)} votos</div></div>`;
  return `<div class="card"><h2>Como está agora</h2>
    <p class="note">Porcentagem sobre os votos das seções já apuradas no 2º turno.</p>
    <div class="confronto">
      ${lado(a, pa, m.candidatos[a].t2, "esq")}
      ${lado(b, pb, m.candidatos[b].t2, "dir")}
    </div>
    <div class="pilha" role="img" aria-label="${d.candidatos[a]} ${dec(pa)}%, ${d.candidatos[b]} ${dec(pb)}%">
      <i style="width:${pa}%;background:${cores[0]}"></i>
      <i style="width:${pb}%;background:${cores[1]}"></i>
      <i style="width:${resto}%;background:var(--neutral)"></i>
    </div>
    <p class="antes">No 1º turno, <strong>nas mesmas seções</strong>:
      ${dec(m.candidatos[a].share_t1)}% × ${dec(m.candidatos[b].share_t1)}%
      · brancos, nulos e demais candidatos somam ${dec(resto)}% agora.</p>
  </div>`;
}

function calcMetricas(t1, t2, nums) {
  const pc = (p, t) => t ? 100 * p / t : null;
  const um = n => ({
    t1: t1[n], t2: t2[n], delta: t2[n] - t1[n],
    pct: t1[n] ? 100 * (t2[n] - t1[n]) / t1[n] : null,
    share_t1: pc(t1[n], t1.total), share_t2: pc(t2[n], t2.total),
  });
  const c = {}; nums.forEach(n => c[n] = um(n));
  const [a, b] = nums;
  const m1 = t1[a] - t1[b], m2 = t2[a] - t2[b];
  return { candidatos: c, diferenca_crescimento: c[a].delta - c[b].delta,
    margem_t1: m1, margem_t2: m2, variacao_margem: m2 - m1,
    total_t1: t1.total, total_t2: t2.total, delta_total: t2.total - t1.total,
    pct_total: t1.total ? 100 * (t2.total - t1.total) / t1.total : null,
    brancos_nulos_t1: t1.brancos + t1.nulos, brancos_nulos_t2: t2.brancos + t2.nulos };
}

function porPais(d) {
  const nums = Object.keys(d.candidatos).sort((a, b) => a - b);
  const grupos = {};
  d.cidades.forEach(c => (grupos[c.pais || "—"] ||= []).push(c));
  return Object.entries(grupos).map(([pais, cs]) => ({
    codigo: "pais:" + pais, nome: pais, ncidades: cs.length,
    ...somaCidades(cs, nums),
  }));
}

/* ---- evolução ao longo da apuração: % de cada um, 2º turno x 1º turno ---- */
function linhaTempo(hist, d, cores) {
  const nums = Object.keys(d.candidatos).sort((a, b) => a - b);
  const pts = hist.filter(h => nums.every(n => h[`p${n}_t2`] != null));
  if (pts.length < 2) {
    return `<div class="card"><h2>Evolução da apuração</h2>
      <p class="note">Com ${pts.length} leitura${pts.length === 1 ? "" : "s"} ainda
      não dá para traçar a curva. O gráfico aparece a partir da segunda coleta
      — o robô roda a cada 15 minutos.</p></div>`;
  }
  const W = 760, H = 300, m = { t: 16, r: 92, b: 34, l: 44 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const ts = pts.map(h => new Date(h.gerado_em).getTime());
  const t0 = Math.min(...ts), t1 = Math.max(...ts);
  const vals = pts.flatMap(h => nums.flatMap(n => [h[`p${n}_t2`], h[`p${n}_t1`]]))
    .filter(v => v != null);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const folga = Math.max(2, (hi - lo) * 0.18);
  lo = Math.max(0, lo - folga); hi = Math.min(100, hi + folga);
  const X = t => m.l + (t1 === t0 ? iw : (t - t0) / (t1 - t0) * iw);
  const Y = v => m.t + (hi - v) / (hi - lo) * ih;

  let eixo = "";
  for (let i = 0; i <= 4; i++) {
    const v = lo + (hi - lo) * i / 4, y = Y(v);
    eixo += `<line class="gl" x1="${m.l}" x2="${m.l + iw}" y1="${y}" y2="${y}"></line>
      <text class="ax" x="${m.l - 8}" y="${y + 4}" text-anchor="end">${v.toFixed(0)}%</text>`;
  }
  const hora = t => new Date(t).toLocaleTimeString("pt-BR",
    { hour: "2-digit", minute: "2-digit" });
  [t0, t1].forEach((t, i) => {
    eixo += `<text class="ax" x="${X(t)}" y="${m.t + ih + 20}"
      text-anchor="${i ? "end" : "start"}">${hora(t)}</text>`;
  });

  let linhas = "";
  nums.forEach((n, i) => {
    [["_t2", 0], ["_t1", 1]].forEach(([suf, trac]) => {
      const dd = pts.map((h, k) => `${X(ts[k]).toFixed(1)} ${Y(h[`p${n}${suf}`]).toFixed(1)}`);
      linhas += `<path d="M${dd.join("L")}" fill="none" stroke="${cores[i]}"
        stroke-width="2" stroke-linejoin="round" stroke-linecap="round"
        ${trac ? 'stroke-dasharray="5 4" opacity=".62"' : ""}></path>`;
    });
    const ult = pts[pts.length - 1];
    linhas += `<circle cx="${X(t1)}" cy="${Y(ult[`p${n}_t2`])}" r="4"
        fill="${cores[i]}" stroke="var(--surface-1)" stroke-width="2"></circle>
      <text class="lbl-strong" x="${m.l + iw + 10}" y="${Y(ult[`p${n}_t2`]) + 4}"
        fill="${cores[i]}">${dec(ult[`p${n}_t2`])}%</text>`;
  });

  // faixas invisíveis para o tooltip, uma por leitura
  const faixa = iw / Math.max(1, pts.length - 1);
  const alvos = pts.map((h, k) => {
    const corpo = nums.map(n =>
      `${d.candidatos[n]}: <b>${dec(h[`p${n}_t2`])}%</b> `
      + `<span style="opacity:.7">(1T ${dec(h[`p${n}_t1`])}%)</span>`).join("<br>");
    return `<rect x="${(X(ts[k]) - faixa / 2).toFixed(1)}" y="${m.t}"
      width="${faixa.toFixed(1)}" height="${ih}" fill="transparent"
      data-tip="${encodeURIComponent(
        `<b>${hora(ts[k])}</b> · ${nf(h.secoes)} seções<br>${corpo}`)}"></rect>`;
  }).join("");

  const leg = nums.map((n, i) =>
    `<span><span class="sw" style="background:${cores[i]}"></span>${d.candidatos[n]}</span>`
  ).join("") + `<span style="color:var(--text-muted)">— contínuo: 2º turno ·
     tracejado: 1º turno nas mesmas seções</span>`;

  return `<div class="card"><h2>Evolução da apuração</h2>
    <p class="note">Como a porcentagem de cada um mudou conforme as seções
      chegaram, comparada com o 1º turno nas mesmas seções.
      ${pts.length} leituras.</p>
    <div class="legend">${leg}</div>
    <div class="scroll"><svg viewBox="0 0 ${W} ${H}" role="img">
      ${eixo}${linhas}${alvos}</svg></div></div>`;
}

let DADOS = null, CIDADE = null, MUNDO = null, HIST = [], MODO = 'cidade';

function desenha() {
  const d = DADOS, nums = Object.keys(d.candidatos).sort((a, b) => a - b);
  const css = getComputedStyle(document.documentElement);
  const cor = n => css.getPropertyValue(n).trim();
  const cores = [cor("--series-1"), cor("--series-2")];
  const nomes = nums.map(n => d.candidatos[n]);

  let c, contexto;
  if (CIDADE === "__agg__") {
    c = { nome: "Todo o exterior", ...somaCidades(d.cidades, nums) };
    const paises = new Set(d.cidades.filter(x => x.secoes_apuradas_t2).map(x => x.pais));
    contexto = `${d.cidades.filter(x => x.secoes_apuradas_t2).length} de `
      + `${d.cidades.length} cidades · ${paises.size} países`;
  } else if (CIDADE.startsWith("pais:")) {
    const pais = CIDADE.slice(5);
    const cs = d.cidades.filter(x => (x.pais || "—") === pais);
    c = { nome: pais, ...somaCidades(cs, nums) };
    contexto = `${cs.length} cidade${cs.length > 1 ? "s" : ""}: `
      + cs.map(x => x.nome).join(" · ");
  } else {
    c = d.cidades.find(x => x.codigo === CIDADE);
    contexto = c.pais || "";
  }

  $("#nome").textContent = c.nome;
  $("#sub").innerHTML = `${contexto}<br>`
    + `<strong>${nf(c.secoes_apuradas_t2)}</strong> de ${nf(c.secoes_previstas)} `
    + `seções com boletim de urna no 2º turno`;
  $("#prog").style.width =
    (100 * c.secoes_apuradas_t2 / Math.max(1, c.secoes_previstas)).toFixed(1) + "%";
  $("#ger").textContent = " · gerado em "
    + new Date(d.gerado_em).toLocaleString("pt-BR");

  $("#mapa").innerHTML = (d.falhas && d.falhas.length
      ? `<div class="aviso"><strong>${d.falhas.length} cidade${
          d.falhas.length > 1 ? "s" : ""} não respondeu${
          d.falhas.length > 1 ? "ram" : ""} nesta coleta:</strong> `
        + d.falhas.map(f => f.nome).join(", ")
        + `. As seções delas seguem no total previsto, mas sem votos — `
        + `a próxima execução tenta de novo.</div>`
      : "")
    + (d.cidades.length > 1 ? desenhaMapa(d, cores) : "");

  if (!c.metricas) {
    $("#status").innerHTML = `<div class="card"><div class="empty">
      Nenhuma seção ${CIDADE === "__agg__" ? "" : "desta cidade "}foi apurada
      no 2º turno ainda. O painel se atualiza sozinho quando os boletins
      chegarem.</div></div>`;
    $("#conteudo").innerHTML = "";
    ligaCliques();
    return;
  }
  $("#status").innerHTML = "";
  const m = c.metricas;

  const tiles = `<div class="tiles">
    <div class="tile"><div class="k">Margem no 2º turno</div>
      <div class="v">${sf(m.margem_t2)}</div>
      <div class="n">era ${sf(m.margem_t1)} no 1º turno</div></div>
    <div class="tile"><div class="k">Variação da margem</div>
      <div class="v">${sf(m.variacao_margem)}</div>
      <div class="n">diferença no crescimento dos dois</div></div>
    <div class="tile"><div class="k">Total de votos (2º turno)</div>
      <div class="v">${nf(m.total_t2)}</div>
      <div class="n">${sf(m.delta_total)} vs 1º turno · ${pf(m.pct_total)}</div></div>
    <div class="tile"><div class="k">Brancos + nulos</div>
      <div class="v">${nf(m.brancos_nulos_t2)}</div>
      <div class="n">era ${nf(m.brancos_nulos_t1)} no 1º turno</div></div>
  </div>`;

  const series = nums.map((n, i) => ({ chave: n, nome: d.candidatos[n], cor: cores[i] }));
  const legenda = `<div class="legend">` + series.map(s =>
    `<span><span class="sw" style="background:${s.cor}"></span>${s.nome}</span>`
  ).join("") + `</div>`;

  const grupos = [
    { rotulo: "1º turno", ...Object.fromEntries(nums.map(n => [n, m.candidatos[n].t1])) },
    { rotulo: "2º turno", ...Object.fromEntries(nums.map(n => [n, m.candidatos[n].t2])) },
  ];

  const cresc = nums.map((n, i) => ({
    nome: d.candidatos[n], valor: m.candidatos[n].delta,
    pct: m.candidatos[n].pct, cor: cores[i],
  }));

  const linhas = (c.secoes || []).filter(s => s.t1 && s.t2).map(s => {
    const a = nums[0], b = nums[1];
    return `<tr>
      <td>${s.secao}</td>
      <td>${nf(s.t1[a])}</td><td>${nf(s.t2[a])}</td>
      <td class="delta">${sf(s.t2[a] - s.t1[a])}</td>
      <td>${nf(s.t1[b])}</td><td>${nf(s.t2[b])}</td>
      <td class="delta">${sf(s.t2[b] - s.t1[b])}</td>
      <td>${nf(s.t1.comparecimento)}</td><td>${nf(s.t2.comparecimento)}</td></tr>`;
  }).join("");

  const tabela = linhas ? `<div class="card">
    <h2>Por seção</h2>
    <p class="note">Só as seções com boletim nos dois turnos — comparação 1:1.</p>
    <div class="scroll"><table><thead>
      <tr><th rowspan="2">Seção</th>
          <th colspan="3"><span class="sw" style="background:${cores[0]}"></span>${nomes[0]}</th>
          <th colspan="3"><span class="sw" style="background:${cores[1]}"></span>${nomes[1]}</th>
          <th colspan="2">Comparecimento</th></tr>
      <tr><th>1T</th><th>2T</th><th>Δ</th><th>1T</th><th>2T</th><th>Δ</th>
          <th>1T</th><th>2T</th></tr>
    </thead><tbody>${linhas}</tbody>
    <tfoot><tr><td>Total</td>
      <td>${nf(m.candidatos[nums[0]].t1)}</td><td>${nf(m.candidatos[nums[0]].t2)}</td>
      <td class="delta">${sf(m.candidatos[nums[0]].delta)}</td>
      <td>${nf(m.candidatos[nums[1]].t1)}</td><td>${nf(m.candidatos[nums[1]].t2)}</td>
      <td class="delta">${sf(m.candidatos[nums[1]].delta)}</td>
      <td>${nf(c.t1.comparecimento)}</td><td>${nf(c.t2.comparecimento)}</td>
    </tr></tfoot></table></div></div>` : "";

  $("#conteudo").innerHTML = tiles + confronto(d, m, cores)
    + linhaTempo(HIST, d, cores) + `
    <div class="card"><h2>Votos por turno</h2>
      <p class="note">Mesmo eixo para os dois turnos; apenas seções comparáveis.</p>
      ${legenda}<div class="scroll">${barrasAgrupadas(grupos, series)}</div></div>
    <div class="card"><h2>Crescimento de cada um</h2>
      <p class="note">Quanto cada um ganhou do 1º para o 2º turno, nas mesmas
        seções. Os dois jeitos de medir podem apontar para lados diferentes.</p>
      ${blocosCrescimento(d, m, cores)}
      <div class="scroll">${barrasCrescimento(cresc)}</div></div>`
    + (CIDADE.startsWith("pais:") || CIDADE === "__agg__"
        ? tabelaRanking(d, cores) : tabela);

  ligaCliques();
}

function ligaCliques() {
  document.querySelectorAll("[data-tip]").forEach(el => {
    if (!el.classList.contains("cidade")) el.style.cursor = "crosshair";
    el.addEventListener("mousemove", e =>
      mostraTip(e, decodeURIComponent(el.dataset.tip)));
    el.addEventListener("mouseleave", escondeTip);
  });
  document.querySelectorAll("[data-modo]").forEach(el => {
    el.addEventListener("click", () => { MODO = el.dataset.modo; desenha(); });
  });
  document.querySelectorAll("[data-cidade]").forEach(el => {
    el.addEventListener("click", () => {
      CIDADE = el.dataset.cidade;
      $("#cidade").value = CIDADE;
      escondeTip();
      desenha();
      scrollTo({ top: 0, behavior: "smooth" });
    });
  });
}

Promise.all([
  fetch("dados/resumo.json", { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .catch(e => { e.semDados = true; throw e; }),
  fetch("dados/mundo.json").then(r => r.ok ? r.json() : null).catch(() => null),
  fetch("dados/historico.jsonl", { cache: "no-store" })
    .then(r => r.ok ? r.text() : "").catch(() => ""),
])
  .then(([d, mundo, hist]) => {
    DADOS = d; MUNDO = mundo;
    HIST = hist.split("\n").filter(l => l.trim())
      .map(l => { try { return JSON.parse(l); } catch { return null; } })
      .filter(Boolean)
      .sort((a, b) => a.gerado_em.localeCompare(b.gerado_em));

    const sel = $("#cidade");
    const varias = d.cidades.length > 1;
    if (varias) {
      sel.add(new Option("Todo o exterior", "__agg__"));
      const gp = document.createElement("optgroup"); gp.label = "Países";
      porPais(d).filter(p => p.secoes_apuradas_t2)
        .sort((a, b) => a.nome.localeCompare(b.nome, "pt"))
        .forEach(p => gp.appendChild(new Option(p.nome, p.codigo)));
      if (gp.children.length) sel.add(gp);
      const gc = document.createElement("optgroup"); gc.label = "Cidades";
      d.cidades.slice().sort((a, b) => a.nome.localeCompare(b.nome, "pt"))
        .forEach(c => gc.appendChild(new Option(
          c.nome + (c.secoes_apuradas_t2 ? "" : " (sem apuração)"), c.codigo)));
      sel.add(gc);
    }
    sel.style.display = varias ? "" : "none";
    CIDADE = varias ? "__agg__" : d.cidades[0].codigo;
    sel.value = CIDADE;
    sel.onchange = () => { CIDADE = sel.value; desenha(); };
    desenha();
  })
  .catch(e => {
    // distingue "não achei os dados" de "quebrei ao desenhar" — misturar os
    // dois já mascarou um erro de render aqui.
    const semDados = e.semDados === true;
    $("#nome").textContent = semDados ? "sem dados" : "erro ao desenhar";
    $("#sub").textContent = semDados
      ? "não foi possível carregar dados/resumo.json"
      : "os dados chegaram, mas o painel falhou";
    $("#status").innerHTML = `<div class="card"><div class="empty">` + (semDados
      ? `Rode <code>python3 coletor/coleta.py</code> (ou aguarde o GitHub Actions)
         para gerar <code>docs/dados/resumo.json</code>. (${e.message})`
      : `<strong>${e.message}</strong><pre style="white-space:pre-wrap;
         font-size:11.5px;overflow-x:auto">${(e.stack || "").slice(0, 900)}</pre>`)
      + `</div></div>`;
  });
</script>
